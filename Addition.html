<!doctype html>
<html lang="en">
  <head>
    <title>Division</title>
  </head>
  <h1>Division</h1>
  <script>
    function division() {
      var a = parseInt(document.getElementById("num1").value);
      var b = parseInt(document.getElementById("num2").value);
      var div = a / b;
      //   document.write(div);
      document.getElementById("demo").innerHTML = parseInt(div);
    }
  </script>
  <body>
    <input type="text" id="num1" placeholder="value1" />
    <input type="text" id="num2" placeholder="value2" />
    <button type="button" onclick="division()">Division</button>
    <p id="demo"></p>
  </body>
</html>
