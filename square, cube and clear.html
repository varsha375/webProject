<!doctype html>
<html lang="en">
  <head>
    <title>Square Cube and Clear</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff9a9e, #a18cd1);
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 4 10px 25px rgba(4, 4, 4, 0.2);
        text-align: center;
        width: 350px;
        border: 8px outset #ef868a;
        height: auto;
      }

      h1 {
        margin-bottom: 25px;
        color: #333;
      }

      input {
        width: 90%;
        padding: 10px;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid #ddd;
        margin-bottom: 20px;
        outline: none;
      }

      input:focus {
        border-color: #ff758c;
      }

      button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
      }

      .square-btn {
        background-color: #6a11cb;
        color: white;
      }

      .cube-btn {
        background-color: #2575fc;
        color: white;
      }

      .clear-btn {
        background-color: #ff4b5c;
        color: white;
      }

      button:hover {
        opacity: 0.8;
        transform: scale(1.05);
      }

      #data1 {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        color: #444;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Square & Cube Calculator</h1>

      <input type="text" placeholder="Enter a number" id="num1" />

      <br />

      <button type="button" class="square-btn" onclick="square()">
        Square
      </button>
      <button type="button" class="cube-btn" onclick="cube()">Cube</button>
      <button type="button" class="clear-btn" onclick="clr()">Clear</button>

      <p id="data1"></p>
    </div>

    <script>
      function square() {
        var x = document.getElementById("num1").value;
        document.getElementById("data1").innerHTML = "Square: " + x * x;
      }

      function cube() {
        var y = document.getElementById("num1").value;
        document.getElementById("data1").innerHTML = "Cube: " + y * y * y;
      }

      function clr() {
        document.getElementById("num1").value = "";
        document.getElementById("data1").innerHTML = "";
      }
    </script>
  </body>
</html>
