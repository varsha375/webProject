<!doctype html>
<html lang="en">
  <head>
    <title>variables and datatypes</title>
  </head>
  <body>
    <script>
      var a = ["Rajesh", "Mahesh", "Suresh"];
      var b = { name: "Arushi", lastname: "Bhat" };
      var c = true;
      document.write("Value of a=" + a + "<br />");
      document.write("Type of a value=" + typeof a + "<br />");
      document.write("Value of b=" + b + "<br />");
      document.write("Type of b value=" + typeof b + "<br />");
      document.write("Value of c=" + c + "<br />");
      document.write("Type of c value=" + typeof c + "<br />");

      // var x = "Rahul";

      // document.write("Value of z=" + z + "<br />");
      // document.write("Type of z value=" + typeof z + "<br />");
    </script>
  </body>
</html>
